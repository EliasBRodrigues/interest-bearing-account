spring.application.name=conta-remunerada
server.port=8081

app.cors-origin=${CORS_ORIGIN:http://localhost:9000}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/conta;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=30000}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:conta-local}
#spring.jpa.hibernate.ddl-auto=validate
# local test
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC